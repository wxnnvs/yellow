<!DOCTYPE HTML>
<html>

<head>
  <title>Yellow</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Parisienne&family=Zain:ital,wght@0,200;0,300;0,400;0,700;0,800;0,900;1,300;1,400&display=swap"
    rel="stylesheet">

  <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0"> -->
</head>

<body>
  <style>
    .masonry {
      /* Required styles */
      display: grid;
      overflow: hidden;
      /* Optional styles */
      gap: 10px;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
    }

    .frame {
      /* Required styles */
      aspect-ratio: var(--width) / var(--height);
    }

    .frame img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;

      border-radius: 8px;
    }

    img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    #loader {
      display: none;
    }

    #header {
      text-align: center;
      margin: 40px 0;

      background: linear-gradient(90deg, #f9d423 0%, #ff4e50 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;

      font-size: 2rem;
    }

    .parisienne-regular {
      font-family: "Parisienne", cursive;
      font-weight: 400;
      font-style: normal;
    }
  </style>

  <div id="header">
    <h1 class="parisienne-regular">Yellow</h1>
  </div>

  <div class="masonry">
    <!-- Each item must have aspect-ratio set by --width and --height CSS variables -->
    <div class="frame" style="--width: 1268; --height: 1130;">
      <img src="./images/1.png" alt="1" />
    </div>
    <div class="frame" style="--width: 1514; --height: 1589;">
      <img src="./images/2.png" alt="2" />
    </div>
    <div class="frame" style="--width: 832; --height: 783;">
      <img src="./images/3.png" alt="3" />
    </div>
    <div class="frame" style="--width: 1500; --height: 1164;">
      <img src="./images/4.png" alt="4" />
    </div>
    <div class="frame" style="--width: 2000; --height: 1500;">
      <img src="./images/5.png" alt="5" />
    </div>
    <div class="frame" style="--width: 866; --height: 659;">
      <img src="./images/6.png" alt="6" />
    </div>
    <div class="frame" style="--width: 1419; --height: 851;">
      <img src="./images/7.png" alt="7" />
    </div>
    <div class="frame" style="--width: 1244; --height: 1021;">
      <img src="./images/8.png" alt="8" />
    </div>
    <div class="frame" style="--width: 1063; --height: 1827;">
      <img src="./images/9.png" alt="9" />
    </div>
    <div class="frame" style="--width: 1325; --height: 1343;">
      <img src="./images/10.png" alt="10" />
    </div>
  </div>

  <div id="loader">
    <p>loading more images ...</p>
  </div>

  <script type="module">
    import { BalancedMasonryGrid } from 'https://cdn.skypack.dev/@masonry-grid/vanilla'

    // randomise initial items and capture originals for infinite re-use
    let originalFrames = []
    window.onload = () => {
      const container = document.querySelector('.masonry')
      const items = Array.from(container.querySelectorAll('.frame'))
      items.sort(() => Math.random() - 0.5)
      items.forEach(item => item.parentNode.appendChild(item))

      // capture clones of the original frames to reuse when loading more
      originalFrames = Array.from(container.querySelectorAll('.frame')).map(f => f.cloneNode(true))

      for (let i = 0; i < 3; i++) {
        loadMoreImages();
      }
    }

    new BalancedMasonryGrid(document.querySelector('.masonry'))

    let imageCount = 0
    const imagesPerLoad = 10
    let isLoading = false

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array
    }

    function loadMoreImages() {
      if (isLoading) return
      const loader = document.getElementById('loader')
      loader.style.display = 'block'
      isLoading = true

      setTimeout(() => {
        if (originalFrames.length === 0) {
          loader.style.display = 'none'
          isLoading = false
          return
        }

        // append a shuffled copy of the original images
        const shuffled = shuffle(originalFrames.map(f => f.cloneNode(true)))
        // Limit to imagesPerLoad if needed (will use all originals by default)
        for (let i = 0; i < Math.min(imagesPerLoad, shuffled.length); i++) {
          document.querySelector('.masonry').appendChild(shuffled[i])
          imageCount++
        }

        loader.style.display = 'none'
        isLoading = false
      }, 600)
    }

    // infinite scroll: load when near bottom
    window.addEventListener('scroll', () => {
      if (window.innerHeight + window.scrollY >= document.body.offsetHeight - document.body.offsetHeight * 0.35) {
        loadMoreImages()
      }
    })


  </script>
</body>

</html>
