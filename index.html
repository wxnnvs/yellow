<!DOCTYPE HTML>
<html>
<head>
<title>Yellow</title>
</head>
<body>
<style>
.masonry {
  /* Required styles */
  display: grid;
  overflow: hidden;
  /* Optional styles */
  gap: 10px;
  grid-template-columns: repeat(auto-fill, minmax(500px, 1fr));
}

.frame {
  /* Required styles */
  aspect-ratio: var(--width) / var(--height);
}

.frame img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;

  border-radius: 8px;
}

img {
  max-width: 100%;
  height: auto;
  display: block;
}

</style>
<div class="masonry">
  <!-- Each item must have aspect-ratio set by --width and --height CSS variables -->
  <div class="frame" style="--width: 1268; --height: 1130;">
    <img src="./images/1.png" alt="1" />
  </div>
  <div class="frame" style="--width: 1514; --height: 1589;">
    <img src="./images/2.png" alt="2" />
  </div>
  <div class="frame" style="--width: 832; --height: 783;">
    <img src="./images/3.png" alt="3" />
  </div>
  <div class="frame" style="--width: 1500; --height: 1164;">
    <img src="./images/4.png" alt="4" />
  </div>
  <div class="frame" style="--width: 2000; --height: 1500;">
    <img src="./images/5.png" alt="5" />
  </div>
  <div class="frame" style="--width: 866; --height: 659;">
    <img src="./images/6.png" alt="6" />
  </div>
  <div class="frame" style="--width: 1419; --height: 851;">
    <img src="./images/7.png" alt="7" />
  </div>
  <div class="frame" style="--width: 1244; --height: 1021;">
    <img src="./images/8.png" alt="8" />
  </div>
  <div class="frame" style="--width: 1063; --height: 1827;">
    <img src="./images/9.png" alt="9" />
  </div>
  <div class="frame" style="--width: 1325; --height: 1343;">
    <img src="./images/10.png" alt="10" />
  </div>
</div>
<script type="module">
import { BalancedMasonryGrid } from 'https://cdn.skypack.dev/@masonry-grid/vanilla'

window.onload = () => {
  // randomise the order of the items
  const items = Array.from(document.querySelectorAll('.frame'))
  items.sort(() => Math.random() - 0.5)
  items.forEach(item => item.parentNode.appendChild(item))
}

new BalancedMasonryGrid(document.querySelector('.masonry'))



</script>
</body>
</html>
